name: Windows EXE build
on:
  push:
    paths:
      - 'exe_entry.py'
      - 'main.py'
      - 'requirements.txt'
      - 'test_launcher.py'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Validate source
        run: |
          python -m py_compile exe_entry.py main.py
      - name: Run offline launcher tests
        run: |
          python -m unittest -v test_launcher
      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name YuketangAssistant exe_entry.py
      - name: Smoke test EXE exit without server calls
        shell: pwsh
        run: |
          '0' | & .\\dist\\YuketangAssistant.exe
          if ($LASTEXITCODE -ne 0) { throw "EXE smoke test failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: YuketangAssistant-Windows
          path: dist/YuketangAssistant.exe
